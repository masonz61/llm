<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action Item Extractor</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; margin: 2rem auto; max-width: 800px; padding: 0 1rem; }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.25rem; margin-top: 1.5rem; }
      textarea { width: 100%; min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace; }
      button { padding: 0.5rem 1rem; }
      .items { margin-top: 1rem; }
      .item { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
      .muted { color: #6b7280; font-size: 0.875rem; }
      .row { display: flex; gap: 0.5rem; align-items: center; }
      .message { padding: 0.5rem; margin-top: 0.5rem; border-radius: 0.25rem; }
      .success { background-color: #d1fae5; color: #065f46; }
      .error { background-color: #fee2e2; color: #991b1b; }
      .note-item { border: 1px solid #e5e7eb; padding: 0.75rem; margin: 0.5rem 0; border-radius: 0.25rem; }
      .note-content { font-size: 0.95rem; margin-bottom: 0.25rem; }
      .note-date { font-size: 0.8rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <h1>Action Item Extractor</h1>
    <p class="muted">Paste notes and extract actionable items. Minimal raw HTML frontend.</p>

    <label for="text">Notes</label>
    <textarea id="text" placeholder="Paste notes here...&#10;e.g.&#10;- [ ] Set up database&#10;- Implement extract endpoint"></textarea>
    <div class="row">
      <label class="row"><input id="save_note" type="checkbox" checked /> Save as note</label>
      <button id="extract">Extract</button>
      <button id="extract_llm">Extract LLM</button>
    </div>

    <div id="extract_message"></div>
    <div class="items" id="items"></div>

    <h2>Notes Management</h2>
    <button id="list_notes">List Notes</button>
    <div id="notes_message"></div>
    <div class="items" id="notes"></div>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const itemsEl = $('#items');
      const notesEl = $('#notes');
      const extractBtn = $('#extract');
      const extractLlmBtn = $('#extract_llm');
      const listNotesBtn = $('#list_notes');
      const extractMsgEl = $('#extract_message');
      const notesMsgEl = $('#notes_message');

      // Helper to show messages
      const showMessage = (el, text, isError = false) => {
        el.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${text}</div>`;
      };

      // Extract button handler
      extractBtn.addEventListener('click', async () => {
        const text = $('#text').value;
        const save = $('#save_note').checked;
        itemsEl.textContent = 'Extracting...';
        extractMsgEl.innerHTML = '';
        try {
          const res = await fetch('/action-items/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, save_note: save }),
          });
          if (!res.ok) {
            const error = await res.json();
            throw new Error(error.detail || 'Request failed');
          }
          const data = await res.json();
          if (!data.items || data.items.length === 0) {
            itemsEl.innerHTML = '<p class="muted">No action items found.</p>';
            showMessage(extractMsgEl, 'No items extracted (heuristic method)');
            return;
          }
          itemsEl.innerHTML = data.items.map(it => (
            `<div class="item"><input type="checkbox" data-id="${it.id}" /> <span>${it.text}</span></div>`
          )).join('');
          showMessage(extractMsgEl, `Successfully extracted ${data.items.length} item(s).`);
          itemsEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', async (e) => {
              const id = e.target.getAttribute('data-id');
              await fetch(`/action-items/${id}/done`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ done: e.target.checked }),
              });
            });
          });
        } catch (err) {
          console.error(err);
          itemsEl.textContent = '';
          showMessage(extractMsgEl, `Error: ${err.message}`, true);
        }
      });

      // Extract LLM button handler
      extractLlmBtn.addEventListener('click', async () => {
        const text = $('#text').value;
        const save = $('#save_note').checked;
        itemsEl.textContent = 'Extracting with LLM...';
        extractMsgEl.innerHTML = '';
        try {
          const res = await fetch('/action-items/extract-llm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, save_note: save }),
          });
          if (!res.ok) {
            const error = await res.json();
            throw new Error(error.detail || 'Request failed');
          }
          const data = await res.json();
          if (!data.items || data.items.length === 0) {
            itemsEl.innerHTML = '<p class="muted">No action items found.</p>';
            showMessage(extractMsgEl, 'No items extracted (LLM method)');
            return;
          }
          itemsEl.innerHTML = data.items.map(it => (
            `<div class="item"><input type="checkbox" data-id="${it.id}" /> <span>${it.text}</span></div>`
          )).join('');
          showMessage(extractMsgEl, `Successfully extracted ${data.items.length} item(s) using LLM.`);
          itemsEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', async (e) => {
              const id = e.target.getAttribute('data-id');
              await fetch(`/action-items/${id}/done`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ done: e.target.checked }),
              });
            });
          });
        } catch (err) {
          console.error(err);
          itemsEl.textContent = '';
          showMessage(extractMsgEl, `Error: ${err.message}`, true);
        }
      });

      // List Notes button handler
      listNotesBtn.addEventListener('click', async () => {
        notesEl.textContent = 'Loading notes...';
        notesMsgEl.innerHTML = '';
        try {
          const res = await fetch('/notes', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' },
          });
          if (!res.ok) {
            const error = await res.json();
            throw new Error(error.detail || 'Request failed');
          }
          const notes = await res.json();
          if (!notes || notes.length === 0) {
            notesEl.innerHTML = '<p class="muted">No notes found.</p>';
            showMessage(notesMsgEl, 'No notes yet');
            return;
          }
          notesEl.innerHTML = notes.map(note => (
            `<div class="note-item">
              <div class="note-content">${note.content}</div>
              <div class="note-date">Created: ${note.created_at}</div>
            </div>`
          )).join('');
          showMessage(notesMsgEl, `Loaded ${notes.length} note(s).`);
        } catch (err) {
          console.error(err);
          notesEl.textContent = '';
          showMessage(notesMsgEl, `Error: ${err.message}`, true);
        }
      });
    </script>
  </body>
  </html>
